      - growth_adjustments
      - budget_kzt
      - request_ai_review
      description: horizon_days = lead_time_days + review_period_days; поддержанный
        горизонт проверяется через health. Пустой фильтр означает все значения. В
        operational синтетические параметры и наборы с синтетическими или смешанными
        наблюдениями запрещены. economic_profiles могут быть
        пустыми, если задана политика категорий. Дубли/противоречащие профили → 422.
